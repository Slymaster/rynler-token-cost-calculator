name: Publish calculator
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
        id: pages
      - name: Test and build reviewed static package
        env:
          CALCULATOR_SITE_URL: ${{ steps.pages.outputs.base_url }}/
          CALCULATOR_SOURCE_URL: https://github.com/${{ github.repository }}
        run: |
          node --test tests/*.test.mjs
          node scripts/build.mjs --publish-ready
          node scripts/generate-seo-pages.mjs
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
